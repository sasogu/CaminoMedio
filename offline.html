<!DOCTYPE html>
<html data-assets="assets" lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sin conexión • Camino Medio</title>
  <style>
    :root { font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif; color: #111; background: #f5f6f8; }
    body { margin: 0; display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 24px; }
    main { max-width: 420px; background: #fff; border-radius: 16px; padding: 32px 28px; box-shadow: 0 12px 38px rgba(15, 23, 42, 0.12); text-align: center; }
    h1 { font-size: 1.5rem; margin: 0 0 12px; letter-spacing: 0.02em; }
    p { margin: 0 0 16px; color: #444; line-height: 1.5; }
    .tips { font-size: 0.95rem; color: #555; text-align: left; margin: 24px 0 0; padding: 16px; border-radius: 12px; background: #f4f6fb; border: 1px solid #dce3f2; }
    .tips li { margin: 6px 0; }
    .logo { display: block; margin: 0 auto 20px; max-width: 120px; height: auto; }
    @media (prefers-color-scheme: dark) {
      :root { color: #e8e8e8; background: #0b0b0c; }
      main { background: #15171a; box-shadow: 0 12px 40px rgba(0, 0, 0, 0.45); }
      p { color: #c7c7c7; }
      .tips { background: #1f2227; border-color: #2c3137; }
    }
  </style>
  <link rel="stylesheet" href="css/icons.css">
</head>
<body>
  <main>
    <img src="assets/img/logo-maskable.png" alt="Camino Medio" class="logo">
    <h1 id="offline-title">No hay conexión</h1>
    <p id="offline-message">No podemos cargar el contenido ahora mismo. Revisa tu conexión o vuelve a intentarlo en unos instantes.</p>
    <section class="tips" aria-label="Sugerencias para recuperar la conexión">
      <ul>
        <li>Comprueba que tienes datos o Wi-Fi activo.</li>
        <li>Si ya estabas navegando, vuelve atrás e inténtalo de nuevo.</li>
        <li>Una vez recuperes conexión, recarga la página.</li>
      </ul>
    </section>
  </main>
  <script>
    (function(){
      try {
        const params = new URLSearchParams(window.location.search);
        if (params.get('from') === 'external') {
          const title = document.getElementById('offline-title');
          const message = document.getElementById('offline-message');
          if (title) title.textContent = 'Necesitas conexión para continuar';
          if (message) message.textContent = 'Este enlace lleva a la web principal CaminoMedio.org y requiere acceso a Internet. Vuelve cuando tengas conexión para visitarlo.';
        }
      } catch (_) {}
    })();
  </script>
</body>
</html>
